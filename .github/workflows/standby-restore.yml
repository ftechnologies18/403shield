# Secours quotidien — restore de la base PRODUCTION vers le projet Neon de
# secours (modèle de cohabitation N°164 : Supabase = production, Neon =
# backup vivant restauré 1×/jour ; l'archive chiffrée froide reste le
# workflow « backup » hebdomadaire).
#
# Ce que fait ce job (une seule vague, connexions fermées à la sortie — le
# compute Neon se rendort ~5 min après, l'autosuspend fait le ménage) :
#   1. pg_dump de la production (Supabase, session pooler 5432 — compatible
#      pg_dump) avec --no-owner --no-privileges (les rôles propriétaires
#      diffèrent entre hébergeurs) et --clean --if-exists (restore idempotent) ;
#   2. psql du dump dans le projet Neon de secours (endpoint DIRECT, pas le
#      pooler — le DDL massif sur pooler est déconseillé) ;
#   3. contrôle d'intégrité : comptages par table des deux côtés comparés ;
#   4. (rappel) l'archive chiffrée AES-256-GCM reste « backup.yml » (hebdo).
#
# N°166 — deux exigences découvertes en validant le projet Supabase (20/09) :
#   - le client pg_dump du runner (16 par défaut) REFUSE de dumper un serveur
#     PostgreSQL 17 (celui du projet Supabase) — « aborting because of server
#     version mismatch » → installation de postgresql-client-17 (dépôt PGDG) ;
#   - le pooler Supabase sert une PKI PRIVÉE (« Supabase Root 2021 CA »,
#     racine auto-signée absente des magasins publics) : sslmode=verify-full
#     exige la racine committée backend/certs/supabase-prod-ca-2021.crt
#     (PGSSLROOTCERT). Le secours est vérifié TLS comme le reste de l'app.
#
# Prérequis (secrets GitHub, cf. docs/RUNBOOK-POSTGRES.md §10) :
#   - SUPABASE_DATABASE_URL   DSN production (session pooler :5432, SANS
#     paramètre sslmode — ce workflow force verify-full + racine Supabase) ;
#   - NEON_STANDBY_DATABASE_URL  DSN secours Neon ENDPOINT DIRECT (SANS
#     `-pooler` dans le nom d'hôte : le DDL massif sur pooler est
#     déconseillé) — sslmode=require recommandé DANS le DSN.
# Sans ces secrets, le workflow s'arrête proprement (pas d'échec rouge).
#
# N°327 — le DSN de dump est ASSAINI AVANT usage (retrait de pgbouncer/
# sslmode, rebascule 6543 → 5432) : un secret posé avec l'URL du pooler
# transactionnel ne casse plus le secours quotidien (mesuré au run
# 39107606587 : « pg_dump: error: invalid URI query parameter:
# "pgbouncer" »). Le secret est aussi re-posé sur le pooler session 5432.
#
# RPO assumé (écrit noir sur blanc, runbook §10) : le secours a jusqu'à 24 h
# de retard sur la production. L'état des routeurs/utilisateurs hotspot est
# reconstituable par les agents ; l'historique de ventes/journal dépend de ce
# backup quotidien.
#
# Coût quota Neon : ~1 réveil/jour de 5-10 min ≈ 1-2 CU-h/mois (plafond 100).
name: standby-restore

on:
  schedule:
    # 02:43 UTC quotidiennement — nuit Abidjan (GMT), décalé des minutes
    # rondes (charge des runners GitHub, cf. keepalive.yml).
    - cron: "43 2 * * *"
  workflow_dispatch: {}

# Un seul restore à la fois — jamais de cancel (un restore à moitié fait
# serait pire qu'un retard : le suivant le répare complètement).
concurrency:
  group: standby-restore
  cancel-in-progress: false

# Lecture du dépôt nécessaire : la racine TLS Supabase y est committée.
permissions:
  contents: read

jobs:
  restore:
    name: Restore quotidien vers Neon (secours)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Client PostgreSQL 17 (≥ serveur Supabase, sinon pg_dump refuse)
        run: |
          set -euo pipefail
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # N°171/N°173 — le runner résout son pg_dump 16 préinstallé avant
          # le 17 fraîchement installé (mesuré : psql 18.6 vs pg_dump 16.15
          # au run migrate 35647671095) : PATH versionné à CHAQUE étape.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          command -v pg_dump psql
          pg_dump --version && psql --version

      - name: Vérifier la présence des secrets
        id: cfg
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEON_STANDBY_DATABASE_URL: ${{ secrets.NEON_STANDBY_DATABASE_URL }}
        run: |
          if [ -z "${SUPABASE_DATABASE_URL}" ] || [ -z "${NEON_STANDBY_DATABASE_URL}" ]; then
            echo "Secrets SUPABASE_DATABASE_URL/NEON_STANDBY_DATABASE_URL absents — secours sauté (cf. RUNBOOK-POSTGRES.md §10)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: pg_dump production → psql secours (restore complet)
        if: steps.cfg.outputs.configured == 'true'
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEON_STANDBY_DATABASE_URL: ${{ secrets.NEON_STANDBY_DATABASE_URL }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"   # N°171/N°173
          # N°327 — ASSAINISSEMENT DÉFENSIF DU DSN : le secret a déjà été posé
          # avec l'URL du pooler TRANSACTIONNEL (…:6543/postgres?pgbouncer=true
          # — mesuré au run 39107606587 : « pg_dump: error: invalid URI query
          # parameter: "pgbouncer" », secours quotidien rouge). pg_dump exige
          # une connexion SESSION : on retire les paramètres qu'il rejette
          # (pgbouncer, sslmode — le TLS est posé inline par PGSSLMODE) et on
          # rebascule un éventuel port 6543 du pooler vers 5432 (session).
          # Le secret a été re-posé sur le pooler session 5432 : ce pavage est
          # la ceinture ET les bretelles pour la prochaine dérive de config.
          SUPABASE_DUMP_URL="$(python3 - <<'PYEOF'
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          u = urlsplit(os.environ["SUPABASE_DATABASE_URL"])
          q = [(k, v) for k, v in parse_qsl(u.query) if k not in ("pgbouncer", "sslmode")]
          netloc = u.netloc
          if netloc.endswith(":6543"):
              netloc = netloc[: -len(":6543")] + ":5432"
          print(urlunsplit((u.scheme, netloc, u.path, urlencode(q), "")))
          PYEOF
          )"
          echo "→ DSN de dump assaini (paramètres pg_dump valides, port session si besoin)."
          # N°327-bis — POISONNEUR DU POOL NEON : le dump émet
          # set_config('search_path', '', false) (en-tête standard pg_dump) ;
          # via le pooler TRANSACTIONNEL de Neon, cet état persiste sur les
          # connexions serveur du pool (pas de server_reset_query) — les
          # sessions SUIVANTES héritent d'un search_path VIDE : le restore à
          # noms QUALIFIÉS fonctionne, mais le contrôle à noms NUS devient
          # aveugle (« relation does not exist »). Mesuré le 18/10 : le run
          # 08h04 a chargé commands=6044 dans le secours ET le contrôle
          # 08h08 a répondu « relation does not exist » sur cette même table
          # (reproduit en labo : set_config via pooler → nouvelle session →
          # search_path="" → requête nue échoue). Toutes les connexions
          # passent donc par l'ENDPOINT DIRECT (contrat §10) : on retire
          # « -pooler » de l'hôte (un port 6543 transactionnel devient 5432).
          NEON_DIRECT_URL="$(python3 - <<'PYEOF'
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          u = urlsplit(os.environ["NEON_STANDBY_DATABASE_URL"])
          host = u.hostname or ""
          if host.endswith("-pooler"):
              host = host[: -len("-pooler")]
          port = u.port
          if port == 6543:
              port = 5432
          netloc = host if port is None else "%s:%d" % (host, port)
          if u.username:
              userinfo = u.username + ((":" + u.password) if u.password else "")
              netloc = userinfo + "@" + netloc
          print(urlunsplit((u.scheme, netloc, u.path, urlencode(parse_qsl(u.query)), "")))
          PYEOF
          )"
          echo "→ DSN Neon assaini : endpoint direct (jamais le pooler)."
          # N°174 — TLS SÉPARÉ PAR CONNEXION : le premier run réel a échoué
          # (« psql: SSL error: certificate verify failed » sur l'endpoint
          # DIRECT Neon) — les exports GLOBAUX verify-full + racine Supabase
          # (posés pour le pg_dump de la production, PKI privée) s'appliquaient
          # AUSSI à la connexion Neon (PKI publique) ; le DSN du secret ne
          # porte PAS sslmode, l'environnement s'appliquait donc tel quel.
          # Désormais : chaque connexion porte SES variables inline.
          echo "→ Dump de la production (Supabase — verify-full + racine committée)…"
          PGSSLMODE=verify-full \
          PGSSLROOTCERT="$GITHUB_WORKSPACE/backend/certs/supabase-prod-ca-2021.crt" \
          pg_dump --no-owner --no-privileges --clean --if-exists \
            --exclude-table='s4check_*' \
            "$SUPABASE_DUMP_URL" > /tmp/standby.sql
          echo "→ Dump : $(du -h /tmp/standby.sql | cut -f1), $(grep -c '^COPY ' /tmp/standby.sql) table(s)."
          echo "→ Restore vers le secours (Neon, endpoint direct)…"
          # v ON_ERROR_STOP=0 : le --clean émet des DROP ... IF EXISTS sur des
          # tables parfois absentes au premier run (NOTICE, pas erreur) ; une
          # vraie erreur de données sera attrapée par le contrôle d'intégrité.
          # N°174 — Neon : PKI publique, chiffrement SANS vérification contre
          # la racine Supabase (require explicite inline, ne dépend plus de
          # la présence d'un paramètre sslmode dans le secret).
          PGSSLMODE=require \
          psql -v ON_ERROR_STOP=0 --quiet "$NEON_DIRECT_URL" < /tmp/standby.sql
          echo "→ Restore terminé."

      - name: Contrôle d'intégrité (comptages du dump vs secours)
        # N°173 — la production est VIVANTE (mesuré le 21/09 : sessions
        # oscille de ±46 lignes/30 s, commands dérive de quelques unités/min)
        # : l'ancien contrôle comptait la production EN DIRECT APRÈS le
        # restore — course perdue d'avance, le cron quotidien aurait été
        # rouge une nuit sur deux. La référence devient le DUMP lui-même
        # (instantané exact à l'instant T), parsé comme N°169 côté migrate.
        env:
          NEON_STANDBY_DATABASE_URL: ${{ secrets.NEON_STANDBY_DATABASE_URL }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"   # N°171/N°173
          # N°327-bis — même assainissement que l'étape de restore : le
          # contrôle passe LUI AUSSI par l'ENDPOINT DIRECT (un pooler
          # empoisonné par le set_config du dump rendrait les requêtes à
          # noms nus aveugles), et les requêtes sont QUALIFIÉES "public"
          # (ceinture ET bretelles : même un search_path cassé ne peut plus
          # aveugler le contrôle).
          NEON_DIRECT_URL="$(python3 - <<'PYEOF'
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          u = urlsplit(os.environ["NEON_STANDBY_DATABASE_URL"])
          host = u.hostname or ""
          if host.endswith("-pooler"):
              host = host[: -len("-pooler")]
          port = u.port
          if port == 6543:
              port = 5432
          netloc = host if port is None else "%s:%d" % (host, port)
          if u.username:
              userinfo = u.username + ((":" + u.password) if u.password else "")
              netloc = userinfo + "@" + netloc
          print(urlunsplit((u.scheme, netloc, u.path, urlencode(parse_qsl(u.query)), "")))
          PYEOF
          )"
          echo "→ Comptages de référence : parsage du dump (instantané exact à l'instant T)…"
          DUMP_COUNTS="$(awk '
            BEGIN { intable = 0 }
            !intable && /^COPY public\./ {
              t = $0; sub(/^COPY public\./, "", t); sub(/ .*/, "", t)
              intable = 1; n = 0; next
            }
            intable && $0 == "\\." { printf "%s %d\n", t, n; intable = 0; next }
            intable { n++ }
          ' /tmp/standby.sql)"
          if [ -z "$DUMP_COUNTS" ]; then
            echo "Aucun bloc COPY trouvé dans le dump — dump vide ou format inattendu ?!" >&2
            exit 1
          fi
          NTABLES="$(printf '%s\n' "$DUMP_COUNTS" | wc -l)"
          echo "  · $NTABLES table(s) dans le dump"
          FAILED=0
          while read -r T N; do
            DST=$(PGSSLMODE=require psql -t -A --quiet "$NEON_DIRECT_URL" -c "SELECT count(*) FROM \"public\".\"$T\"" || echo "ERR")
            if [ "$N" != "$DST" ]; then
              echo "✗ $T : dump=$N secours=$DST"
              FAILED=1
            else
              echo "✓ $T : $DST ligne(s)"
            fi
          done <<< "$DUMP_COUNTS"
          if [ "$FAILED" -ne 0 ]; then
            echo "Divergence détectée — le secours n'est pas fidèle au dump (à l'instant T)." >&2
            exit 1
          fi
          echo "Intégrité vérifiée : le secours est une copie fidèle de la production (à l'instant T du dump)."

      - name: Hygiène (fermeture des connexions)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          # Rien à faire de plus : pg_dump/psql sont des process one-shot,
          # leurs connexions sont déjà fermées. Le compute Neon de secours
          # se rendort de lui-même (autosuspend 5 min) — le piège du « compute
          # éveillé en continu » (incident N°162) est évité PAR CONSTRUCTION.
          echo "Connexions fermées — le compute Neon de secours va s'endormir (~5 min)."
